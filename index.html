<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>법률사무소 합의</title>
    <style>
        /* 여기서부터 디자인(CSS)입니다 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #1a2b4c; /* 신뢰감 주는 네이비색 */
            color: white;
            padding: 20px 0;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* 살짝 그림자 */
            border-radius: 8px;
        }
        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 300;
        }
        .hero-title {
            font-size: 32px;
            font-weight: bold;
            color: #1a2b4c;
            margin-bottom: 10px;
        }
        .hero-subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }
        .btn {
            background-color: #c5a059; /* 고급스러운 금색 */
            color: white;
            padding: 15px 30px;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            display: inline-block;
        }
        .btn:hover {
            background-color: #b08d45; /* 마우스 올렸을 때 색 변화 */
        }
        footer {
            margin-top: 50px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <h1>법률사무소 합의</h1>
    </header>

    <div class="container">
        <p class="hero-title">당신의 든든한 법률 파트너</p>
        <p class="hero-subtitle">이혼, 기업법무, 그리고 새로운 시작.<br>변호사 김OO이 함께합니다.</p>
        
        <a href="#" class="btn">상담 예약하기</a>

        <div style="margin-top: 50px; text-align: left; line-height: 1.6;">
            <h3>📋 주요 업무 분야</h3>
            <ul>
                <li>이혼 및 가사 소송</li>
                <li>기업 법무 및 자문</li>
                <li>스타트업 법률 리스크 관리</li>
            </ul>
        </div>
    </div>

    <footer>
        <p>서울시 성동구 옥수동 ... (주소 입력)</p>
        <p>© 2026 Law Office Hab-ui. All rights reserved.</p>
    </footer>

</body>
</html>
